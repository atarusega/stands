<!-- Интерфейс — вариант C «Островки» (Никита 30.10): бренд Struktorum, все кнопки в одном доке снизу,
     на телефоне док раскрывается кнопкой «⋯». Шрифты — с сайта struktorum.space; офлайн — системный шрифт. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root { --blue:#3A3ED8; --blue-hi:#4a4ee6; --blue-soft:#C9CBF5; --graph:#1C1C1C; --graph-line:#2C2C2C; --tile:#262626;
  --glass:rgba(28,28,28,.84); --solid:rgba(28,28,28,.96); --line:rgba(255,255,255,.08); --sep:rgba(255,255,255,.14);
  --chip:rgba(255,255,255,.08); --muted:#8d8d88; --dim:#6A6A65;
  --f:'Unbounded',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); color-scheme:dark; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:#101114; color:#fff; font:500 12px/1.3 var(--f); -webkit-tap-highlight-color:transparent; }
#scene { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; touch-action:none; }
a { color:inherit; text-decoration:none; }
button { font:inherit; color:inherit; background:transparent; border:0; border-radius:12px; padding:0; margin:0; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; position:relative; }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible, a:focus-visible { outline:2px solid var(--blue-soft); outline-offset:2px; }
svg { flex-shrink:0; }
[hidden] { display:none !important; }
.glass { background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); }
.mono { font-family:var(--mono); }

/* ---- логотип и название стенда (слева сверху) ---- */
#brand { position:fixed; left:24px; top:24px; display:flex; align-items:center; gap:14px; padding:10px 20px 10px 10px; border-radius:16px;
  max-width:min(480px, calc(100vw - 420px)); z-index:4; }
#brand .mark { width:40px; height:40px; }
#brand .txt { display:flex; flex-direction:column; gap:5px; min-width:0; }
#brand .name { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.6); }
#title, #subtitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#title { font-size:14px; letter-spacing:.02em; }
#subtitle { font-size:11px; color:var(--muted); }
#subtitle:empty { display:none; }

/* ---- Telegram: канал и личка (справа сверху) ---- */
#links { position:fixed; right:24px; top:24px; display:flex; align-items:center; gap:8px; z-index:4; }
#links a { height:48px; display:flex; align-items:center; border-radius:999px; }
#links .chan { padding:0 18px; gap:6px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
#links .chan:hover { background:rgba(44,44,44,.9); }
#links .talk { padding:0 22px; gap:8px; background:var(--blue); font-size:12px; letter-spacing:.04em; transition:background .15s; }
#links .talk:hover { background:var(--blue-hi); }

/* ---- док: все кнопки в одном блоке снизу ---- */
#dock { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); display:flex; align-items:center; gap:6px; padding:8px;
  border-radius:18px; white-space:nowrap; z-index:5; }
#camsel { order:1; height:44px; padding:0 12px 0 16px; background:var(--chip); gap:10px; max-width:260px; }
#camsel:hover { background:rgba(255,255,255,.13); }
#camname { overflow:hidden; text-overflow:ellipsis; }
#camnum { font-family:var(--mono); font-size:11px; color:var(--muted); }
#camsel .chev { transition:transform .15s; }
#dock.camopen #camsel .chev { transform:rotate(180deg); }
#prev { order:2; } #next { order:3; }
#prev, #next { width:36px; height:44px; }
#prev:hover, #next:hover, #tools button:hover { background:var(--chip); }
.sep { width:1px; height:28px; background:var(--sep); margin:0 6px; }
.s1 { order:4; } .s2 { order:7; }
#lights { order:5; display:flex; gap:2px; padding:3px; background:rgba(255,255,255,.06); border-radius:12px; }
#lights button { height:38px; padding:0 12px; border-radius:9px; gap:6px; color:rgba(255,255,255,.78); }
#lights button:hover { color:#fff; }
#lights button.on { background:#fff; color:var(--graph); }
#expo { order:6; display:flex; align-items:center; gap:8px; padding:0 4px 0 8px; color:var(--muted); }
#expo .lbl { display:none; }
#expo input { width:96px; accent-color:var(--blue); }
#exposureVal { font-family:var(--mono); font-size:11px; color:#fff; width:30px; text-align:right; }
#tools { order:8; display:flex; gap:2px; }
#tools button { width:44px; height:44px; }
#tools button.on { background:var(--blue); }
#tools .lbl { display:none; }
#publish { order:9; height:44px; padding:0 16px; margin-left:4px; background:var(--blue); font-size:11px; }
#publish:hover { background:var(--blue-hi); }
/* только телефон: карусель камер, точки, «Свет» одной кнопкой, «Сетка» одной кнопкой и её строка */
#camcar, #camdots, #lightm, #gridm, #gridsub { display:none; }
#gridsub .chip { height:40px; padding:0 14px; border-radius:999px; background:var(--tile); font-size:11px; gap:6px; }
#gridsub .chip.on { background:var(--blue); }
#gback { width:44px; height:44px; flex-shrink:0; }
/* подсказка с горячей клавишей — только мышью */
@media (hover:hover) {
  #dock [data-tip]::after { content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 14px); transform:translateX(-50%);
    padding:8px 12px; background:#fff; color:var(--graph); border-radius:10px; font-size:11px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .12s; }
  #dock [data-tip]:hover::after { opacity:1; transition-delay:.35s; }
  #dock.camopen [data-tip]::after { display:none; }
}
/* список камер — всплывает над кнопкой */
#camlist { display:none; position:absolute; left:8px; bottom:calc(100% + 8px); min-width:220px; max-height:min(60vh, 420px); overflow:auto;
  padding:6px; background:var(--solid); border:1px solid var(--line); border-radius:14px; flex-direction:column; gap:2px; }
#dock.camopen #camlist { display:flex; }
#camlist button { height:40px; padding:0 12px; border-radius:10px; justify-content:space-between; gap:16px; color:rgba(255,255,255,.82); }
#camlist button:hover { background:var(--chip); color:#fff; }
#camlist button.on { background:var(--blue); color:#fff; }
#camlist .k { font-family:var(--mono); font-size:11px; color:var(--dim); }
#camlist button.on .k { color:var(--blue-soft); }
#dock.nocams #camsel, #dock.nocams #prev, #dock.nocams #next, #dock.nocams .s1 { display:none; }

/* вертикальная сетка: поворот и положение — над доком */
#wallctl { position:absolute; left:50%; bottom:calc(100% + 10px); transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:6px 14px 6px 6px;
  background:var(--solid); border:1px solid var(--line);
  border-radius:14px; z-index:5; }
#wturn { height:36px; padding:0 12px; background:var(--chip); font-size:11px; gap:6px; }
#wturn:hover { background:rgba(255,255,255,.13); }
#wpos { width:180px; accent-color:var(--blue); }

/* «Опубликовать» — только в локальной библиотеке 127.0.0.1:8090 (viewer.js), на публичной странице скрыто */
#pubbox { position:fixed; right:24px; top:88px; max-width:min(420px,calc(100vw - 24px)); padding:12px 14px; border-radius:14px; z-index:6; line-height:1.5; }
#pubbox a { color:var(--blue-soft); word-break:break-all; }
#pubbox pre { margin:6px 0 0; max-height:30vh; overflow:auto; font:11px/1.4 var(--mono); white-space:pre-wrap; color:var(--muted); }
#pubbox .row { display:flex; gap:6px; margin-top:10px; }
#pubbox .row button { height:34px; padding:0 12px; background:var(--chip); font-size:11px; }

#fps { position:fixed; right:14px; bottom:10px; color:rgba(255,255,255,.35); font:10px var(--mono); z-index:3; }
body.light #fps { color:rgba(0,0,0,.4); }
body.hide-ui #brand, body.hide-ui #links, body.hide-ui #dock, body.hide-ui #fps, body.hide-ui #pubbox { display:none; }

#loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#101114; z-index:20; transition:opacity .5s; }
#loader.hide { opacity:0; pointer-events:none; }
#loader .ttl { font-size:14px; letter-spacing:.02em; text-align:center; padding:0 24px; }
#loader .track { width:min(360px,70vw); height:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
#bar { height:100%; width:0; background:var(--blue); transition:width .2s; }
#loadtext { color:var(--muted); font:11px var(--mono); }

/* узкий ПК / планшет: свет без подписей, яркость прячем */
@media (max-width:1180px) and (min-width:701px) {
  #lights .t { display:none; }
  #lights button { padding:0 10px; }
  #expo { display:none; }
  #brand { max-width:calc(100vw - 400px); }
}
@media (max-width:900px) and (min-width:701px) {
  #links .chan span { display:none; }
  #links .chan { padding:0 14px; }
}

/* ---- телефон — идея E (Никита 01.11): меню нет, док всегда на виду.
   Сверху карусель камер (листать пальцем), под ней точки, ниже строка кнопок с подписями.
   «Сетка» заменяет строку на «‹ Пол Стена» + поворот и место стены. Яркость на телефоне скрыта. ---- */
@media (max-width:700px) {
  #brand { left:12px; top:12px; gap:10px; padding:6px 14px 6px 6px; border-radius:14px; max-width:calc(100vw - 186px); }
  #brand .mark { width:32px; height:32px; }
  #brand .name, #subtitle { display:none; }
  #title { font-size:11px; }
  #links { right:12px; top:12px; gap:6px; }
  #links a { height:46px; }
  #links .chan { padding:0 14px; font-size:10px; }
  #links .talk { width:46px; padding:0; justify-content:center; }
  #links .talk span { display:none; }

  #dock { left:12px; right:12px; bottom:calc(12px + var(--safe-b)); transform:none; padding:6px 6px 8px; gap:4px; border-radius:20px;
    flex-direction:column; align-items:stretch; white-space:normal; }
  #camsel, #prev, #next, .sep, #lights, #expo, #camlist, #publish, #grid, #wall { display:none; }
  #camcar { order:1; display:flex; gap:6px; height:40px; align-items:center; overflow-x:auto; scroll-snap-type:x mandatory;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent); mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent); }
  #camcar::-webkit-scrollbar { display:none; }
  #camcar::before, #camcar::after { content:''; flex:0 0 50%; }
  #camcar button { flex:0 0 auto; height:32px; padding:0 14px; border-radius:999px; font-size:11px; color:rgba(255,255,255,.5);
    scroll-snap-align:center; transition:background .15s, color .15s; }
  #camcar button.on { background:rgba(255,255,255,.12); color:#fff; }
  #camdots { order:2; display:flex; justify-content:center; align-items:center; gap:4px; height:6px; }
  #camdots b { width:4px; height:4px; border-radius:9px; background:rgba(255,255,255,.3); transition:width .15s; }
  #camdots b.on { width:14px; background:#fff; }
  #dock.nocams #camcar, #dock.nocams #camdots { display:none; }

  #tools { order:3; display:flex; gap:2px; margin-top:4px; }
  /* ширина кнопки — по подписи + поровну остаток: «Вращение» и «Выставка» длиннее «Фон» (на 360 px равные кнопки обрезали подпись) */
  #tools button { flex:1 1 auto; width:auto; height:54px; padding:0 3px; flex-direction:column; gap:5px; }
  #tools .lbl { display:block; font-size:9px; white-space:nowrap; }
  #lightm, #gridm { display:inline-flex; }
  #gridsub { order:4; display:none; align-items:center; gap:6px; height:54px; margin-top:4px; }
  #dock.gridmode #tools { display:none; }
  #dock.gridmode #gridsub { display:flex; }
  #wallctl { order:5; position:static; transform:none; padding:0 4px 2px; background:none; border:0; gap:8px; }
  #dock:not(.gridmode) #wallctl { display:none; }
  #wpos { flex:1; width:auto; }
  #pubbox { left:12px; right:12px; top:70px; }
  #fps { display:none; }
}
@media (max-width:359px) {
  #links .chan { display:none; }
  #tools button { padding:0 1px; }
  #tools .lbl { font-size:8px; }
  #brand { max-width:calc(100vw - 82px); }
}
</style>

<script>
// Модель внутри HTML лежит частями (теги script с __M.push и __p): браузер выполняет их по мере
// скачивания файла — полоса идёт вместе с реальной загрузкой, а не прыгает в конец. Загрузка — 0…85 %.
window.__M = [];
window.__p = function (i, n, mb) {
  var f = function (v) { return v.toFixed(1).replace('.', ','); };
  document.getElementById('bar').style.width = (85 * i / n) + '%';
  document.getElementById('loadtext').textContent = 'Загрузка ' + f(mb * i / n) + ' из ' + f(mb) + ' МБ';
  // ревью В4: текст части уже в __M — сам тег script из DOM убираем, иначе 50 копий base64 живут до закрытия страницы
  if (document.currentScript) document.currentScript.remove();
};
